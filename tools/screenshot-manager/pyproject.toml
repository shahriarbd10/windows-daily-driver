[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-driver-screenshot-manager"
version = "0.1.0"
description = "Windows screenshot organizer utility"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Daily Driver" }
]
license = { text = "MIT" }
dependencies = []

[project.scripts]
screenshot-manager = "screenshot_manager.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
